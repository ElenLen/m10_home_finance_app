<div class="income">
    <h1 class="h1 fw-medium text-primary-emphasis" style="font-size: 40px; margin-bottom: 40px ">
        Доходы
    </h1>
    <section class="content d-flex flex-wrap" style="gap: 20px" id="container">
        <!--  Modal -->
        <div class="modal fade"
             id="staticBackdrop"
             data-bs-backdrop="static"
             data-bs-keyboard="false"
             tabindex="-1"
             aria-labelledby="staticBackdropLabel"
             aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-body text-center" style="padding: 40px 0; font-size: 20px; ">
                        Вы действительно хотите удалить категорию?
                        Связанные доходы останутся без категории.
                        <div style="margin-top: 20px; ">
                            <button type="button" class="btn btn-success me-2" id="income-delete">
                                Да, удалить
                            </button>
                            <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
                                Не удалять
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!--        новый контент с бэка-->
        <div class=" d-flex flex-wrap" style="gap: 20px" id="income-section"></div>

        <!--кнопка для добавления новой категории-->
        <div class="cardWidth border rounded-3 d-flex align-items-center justify-content-center">
            <a href="/create-income" class="text-decoration-none">
                <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
                    <path d="M14.5469 6.08984V9.05664H0.902344V6.08984H14.5469ZM9.32422 0.511719V15.0039H6.13867V0.511719H9.32422Z"
                          fill="#CED4DA"/>
                </svg>
            </a>
        </div>

    </section>
</div>
