<div class="create-income-expenses">
    <h1 class="h1 fw-medium text-primary-emphasis" style="font-size: 40px; margin-bottom: 40px ">
        Создание дохода/расхода
    </h1>
    <section class="content d-flex flex-wrap" style="gap: 20px">
        <div class="border-0" style="max-width: 350px; ">

            <input class="border rounded-2" type="text" placeholder="Тип..." id="type"
                   style="font-size: 15px; width: 397px; margin-bottom: 10px; padding: 7px 16px;">

            <input class="border rounded-2" type="text" placeholder="Категория..." id="category"
                   style="font-size: 15px; width: 397px; margin-bottom: 10px; padding: 7px 16px;">

            <input class="border rounded-2" type="text" placeholder="Сумма в $..." id="amount"
                   style="font-size: 15px; width: 397px; margin-bottom: 10px; padding: 7px 16px;">

            <input class="border rounded-2" type="text" placeholder="Дата..." id="date"
                   style="font-size: 15px; width: 397px; margin-bottom: 10px; padding: 7px 16px;">

            <input class="border rounded-2" type="text" placeholder="Комментарий..." id="comment"
                   style="font-size: 15px; width: 397px; margin-bottom: 10px; padding: 7px 16px;">


            <div style="margin-top: 10px">
                <button type="button" class="btn btn-success" style="margin-right: 10px; font-size: 14px; width: 88px;">
                    Создать
                </button>
                <button type="button" class="btn btn-danger" style="font-size: 14px; width: 88px;">
                    Отмена
                </button>
            </div>
        </div>
    </section>
</div>
